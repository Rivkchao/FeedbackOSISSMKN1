<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Foto OSIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="arsip.css">
</head>

<body>

    <div class="max-w-6xl mx-auto px-4 py-10">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-slate-900">Arsip Foto Interaktif</h1>
            <p id="periode-label" class="text-slate-600 mt-2">Memuat periode kegiatan...</p>
            <a href="index.html"
                class="mt-6 inline-block px-6 py-2 text-white font-semibold rounded-full brown-btn hover:shadow-lg transition-all">
                ← Kembali ke Beranda
            </a>
        </div>

        <div class="relative mt-20">
            <div class="arsip-rope"></div>
            <div id="polaroid-track" class="arsip-track">
            </div>
        </div>

        <div class="mt-16 relative max-w-xl mx-auto">
            <div
                class="absolute -top-6 -left-6 w-20 h-20 bg-sky-100 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob">
            </div>
            <div
                class="absolute -bottom-8 -right-6 w-24 h-24 bg-cyan-100 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000">
            </div>

            <div
                class="relative bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-white/20">
                <div class="flex items-center gap-3 mb-6">
                    <div class="p-2 bg-sky-500 rounded-lg shadow-lg shadow-sky-200">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14" />
                            <path d="M12 5v14" />
                        </svg>
                    </div>
                    <h3 class="text-xl font-extrabold text-slate-800">Tambah Kenangan Baru</h3>
                </div>

                <form id="arsip-form" class="space-y-5">
                    <div class="grid grid-cols-3 gap-4">
                        <div class="col-span-2 space-y-1.5">
                            <label class="text-xs font-bold text-slate-500 uppercase ml-1">Judul Kegiatan</label>
                            <input type="text" id="arsip-title" placeholder="Malam Keakraban"
                                class="w-full px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 outline-none transition-all duration-300">
                        </div>

                        <div class="col-span-1 space-y-1.5">
                            <label class="text-xs font-bold text-slate-500 uppercase ml-1">Tahun</label>
                            <input type="number" id="arsip-year" value="2025"
                                class="w-full px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 outline-none transition-all duration-300">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 uppercase ml-1">URL Gambar</label>
                        <input type="text" id="arsip-img" placeholder="https://images.unsplash.com/..."
                            class="w-full px-4 py-3 bg-slate-50 border-2 border-transparent rounded-xl focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 outline-none transition-all duration-300 font-mono text-sm">
                    </div>

                    <button type="submit"
                        class="group relative w-full overflow-hidden rounded-xl bg-slate-900 px-8 py-4 font-bold text-white transition-all hover:shadow-[0_0_20px_rgba(14,165,233,0.4)] active:scale-95">
                        <div class="relative z-10 flex items-center justify-center gap-2">
                            <span>Simpan ke Jemuran</span>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="group-hover:translate-x-1 transition-transform">
                                <path d="m5 12 7-7 7 7" />
                                <path d="M12 19V5" />
                            </svg>
                        </div>
                        <div
                            class="absolute inset-0 bg-gradient-to-r from-sky-500 to-cyan-500 opacity-0 group-hover:opacity-100 transition-opacity">
                        </div>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div id="toast-container" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2"></div>

    <script>
        const arsipData = [
            { year: 2022, title: 'LDKS Pengurus', img: 'https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=400' },
            { year: 2023, title: 'Pentas Seni', img: 'https://images.unsplash.com/photo-1583787035686-91b82ad5d811?auto=format&fit=crop&w=400' },
            { year: 2024, title: 'Bakti Sosial', img: 'https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=400' },
            { year: 2025, title: 'Class Meeting', img: 'https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=400' },
            { year: 2026, title: 'Rapat Kerja', img: 'https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=400' }
        ];

        const track = document.getElementById('polaroid-track');

        function renderArsip() {
            track.innerHTML = '';
            updatePeriode();
            arsipData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = `polaroid wind`;
                card.style.animationDelay = `${idx * 0.2}s`;
                const randomRot = Math.floor(Math.random() * 6) - 3;
                card.style.transform = `rotate(${randomRot}deg)`;

                card.innerHTML = `
                    <img src="${item.img}" alt="${item.title}" draggable="false">
                    <div class="mt-4 text-center">
                        <div class="font-bold text-slate-800">${item.title}</div>
                        <div class="text-xs text-slate-500">${item.year}</div>
                    </div>
                `;

                track.appendChild(card);
            });
        }

        // Fitur Geser Pakai Mouse (Drag to Scroll)
        let isDown = false;
        let startX;
        let scrollLeft;

        track.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - track.offsetLeft;
            scrollLeft = track.scrollLeft;
        });
        track.addEventListener('mouseleave', () => isDown = false);
        track.addEventListener('mouseup', () => isDown = false);
        track.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - track.offsetLeft;
            const walk = (x - startX) * 2;
            track.scrollLeft = scrollLeft - walk;
        });

        // Form Submit
        document.getElementById('arsip-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const title = document.getElementById('arsip-title').value;
            const img = document.getElementById('arsip-img').value;
            const year = document.getElementById('arsip-year').value;

            if (title && img && year) {
                arsipData.unshift({
                    year: parseInt(year),
                    title: title,
                    img: img
                });

                renderArsip();
                e.target.reset();

                document.getElementById('arsip-year').value = new Date().getFullYear();

                if (typeof showToast === 'function') {
                    showToast('Kenangan berhasil digantung! 📸', 'success');
                }
            } else {
                alert('Lengkapi semua data ya!');
            }
        });

        renderArsip();

        function updatePeriode() {
            const label = document.getElementById('periode-label');
            if (!label || arsipData.length === 0) return;

            // Mengambil semua tahun dari data, lalu cari min & max
            const years = arsipData.map(item => item.year);
            const minYear = Math.min(...years);
            const maxYear = Math.max(...years);

            if (minYear === maxYear) {
                label.textContent = `Kenangan kegiatan OSIS periode ${minYear}`;
            } else {
                label.textContent = `Kenangan kegiatan OSIS periode ${minYear} - ${maxYear}`;
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            const bgColor = type === 'success' ? 'bg-slate-900' : 'bg-red-500';
            const icon = type === 'success'
                ? '<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>'
                : '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';

            toast.className = `${bgColor} text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 transform transition-all duration-500 translate-y-20 opacity-0 border border-white/10 backdrop-blur-md`;

            toast.innerHTML = `
        ${icon}
        <span class="font-semibold text-sm">${message}</span>
    `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-20', 'opacity-0');
            }, 100);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'scale-90');
                setTimeout(() => {
                    toast.remove();
                }, 500);
            }, 3000);
        }
    </script>
</body>

</html>
